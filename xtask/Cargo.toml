[package]
name = "xtask"
description = "ECNU OSLab 2026: host-side build tool (build / run / image / debug / list)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# 空。见 README 与 config.rs 顶部的说明: xtask 自己解析 TOML 子集,
# 不引入 serde/toml/anyhow/clap 之类的依赖。
#
# 【为什么这很重要】
#   1. 教学仓库的构建工具必须"克隆下来就能编译"。任何依赖都意味着
#      `cargo xtask` 第一次运行时要联网 —— 而在实验机房、离线评测
#      环境里这往往不成立。
#   2. xtask 的代码是学生要学会改的地方 (加一个新平台、加一个新
#      产物格式)。一份 2000 行、零依赖、每个函数都能读懂的代码,
#      比一份 300 行、但要先理解 clap 的 derive 宏和 anyhow 的
#      错误传播机制的代码更有教学价值。
#   3. 参数解析和 TOML 解析在这个规模下各只要 100 行左右,
#      而且我们需要的 TOML 子集非常小 (见 config.rs)。
[[bin]]
name = "xtask"
path = "src/main.rs"
