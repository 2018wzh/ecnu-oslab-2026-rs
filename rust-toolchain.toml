# ============================================================================
# 工具链固定
# ----------------------------------------------------------------------------
# 为什么要固定版本 (而不是用 stable 跟随最新):
#   教学仓库必须"在学生的机器上也能编译"。裸机代码大量依赖内联汇编与
#   汇编级的细节, 不同 rustc 版本对它们的检查强度不同 —— 用 stable
#   漂移会让同一份代码在别人的机器上编译失败, 而且报错信息往往和
#   真正的原因无关。
#
# 【关于 targets 与 components】
#   这里**不**声明 targets/components, 只固定 channel。
#
#   原因: 声明它们之后, rustup 每次进入本目录都会去镜像站同步一份
#   分发清单 —— 在离线环境 (以及镜像站的清单偶尔不新鲜的时候) 这会
#   直接让 `cargo` 无法运行, 而错误信息和"我的代码有问题"毫无关系:
#
#       error: the server unexpectedly provided an obsolete version of
#              the distribution manifest
#
#   而目标平台 (riscv64gc-unknown-none-elf) 本来就应该是环境的一部分。
#   缺了它时, xtask 会给出明确的提示 (见 xtask/src/build.rs 的错误处理):
#
#       rustup target add riscv64gc-unknown-none-elf
#
#   "构建工具自己检查依赖并给出可执行的建议" 比 "在工具链文件里声明
#   依赖然后祈祷镜像站可用" 更可靠。
# ============================================================================
[toolchain]
channel = "1.97.1"
